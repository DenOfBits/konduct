site_name: Konduct Documentation
site_description: A Kotlin DSL for MongoDB aggregation pipelines
site_author: DenOfBits
site_url: https://denofbits.github.io/konduct/

repo_name: DenOfBits/konduct
repo_url: https://github.com/DenOfBits/konduct
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
  - User Guide:
      - Core Concepts: guide/core-concepts.md
      - Match & Filter: guide/match.md
      - Sorting: guide/sorting.md
      - Grouping: guide/grouping.md
      - Expressions: guide/expressions.md
      - Pagination: guide/pagination.md
      - Facets: guide/facets.md
      - Custom Stages: guide/custom-stages.md
  - Examples:
      - E-Commerce: examples/ecommerce.md
      - Analytics: examples/analytics.md
      - Time-Series: examples/timeseries.md
  - API Reference: api/index.html
  - Contributing: contributing.md
  - Changelog: changelog.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DenOfBits/konduct
  version:
    provider: mike